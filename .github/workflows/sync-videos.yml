name: Actualizar CDM TV (YouTube)
on:
  push:
    branches: [main]
    paths: ['tools/sync_videos.py', '.github/workflows/sync-videos.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: public-videos, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --upgrade yt-dlp
      - run: python tools/sync_videos.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py
