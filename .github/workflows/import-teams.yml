name: Importar equipos desde el panel
on:
  push:
    branches: [main]
    paths: ['data/team-imports/**', 'data/club-teams.json', 'tools/team_imports.py', 'tools/rfaf_browser.py', 'tools/publish_public_data.py', '.github/workflows/import-teams.yml']
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: club-team-imports
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/team_imports.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Registrar equipos para favoritos y avisos
        env:
          CDM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.CDM_FIREBASE_SERVICE_ACCOUNT }}
        run: node functions/register-teams.js
      - name: Publicar datos y catálogo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py --imports
