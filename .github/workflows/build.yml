name: Verificar y compilar APK
on:
  push:
    branches: [main, feature/favorites-results-0260, feature/club-notifications-0270]
    paths-ignore: ['notification-images/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/bundle_account_assets.py
      - run: python -m unittest discover -s tools -p 'test_google_signin_config.py' -v
      - run: python -m unittest discover -s server/tests -v
      - run: node tools/test_fixtures_ui.js
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - run: node tools/test_matchday_ui.cjs
      - run: node tools/test_report_html.js
      - run: node tools/test_team_theme.js
      - run: node tools/test_roster_identity.js
      - run: node tools/test_auth.js
      - run: node tools/test_registration.cjs
      - run: node tools/test_web_auth.cjs
      - run: node tools/test_teams_ui.cjs
      - run: node tools/test_club_access.cjs
      - run: node tools/test_news_reader.cjs
      - run: node tools/test_favorites.cjs
      - run: node tools/test_notification_panel.cjs
      - run: node tools/test_scheduled_panel.cjs
      - run: node --test tools/test_news_notifications.cjs tools/test_results.cjs tools/test_custom_notifications.cjs tools/test_notification_service.mjs tools/test_teams_service.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: tools/node_modules/.bin/firebase emulators:exec --only firestore --config firebase.test.json --project demo-cdmenciana 'node tools/test_firestore_rules.cjs'
      - run: npm ci --prefix hosting --no-audit --no-fund
      - run: npm run build --prefix hosting
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python tools/bundle_account_assets.py
      - name: Restaurar firma Android estable
        env:
          CDM_KEYSTORE_B64: ${{ secrets.CDM_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$CDM_KEYSTORE_B64" ]; then
            printf '%s' "$CDM_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cdm-signing.jks"
            chmod 600 "$RUNNER_TEMP/cdm-signing.jks"
            echo "CDM_SIGNING_STORE=$RUNNER_TEMP/cdm-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::La firma estable no está configurada; se compilan las pruebas Android, pero la APK no se publicará."
          fi
      - run: gradle -p android testDebugUnitTest assembleDebug lintDebug
      - name: Verificar firma Google OAuth antes de publicar APK
        shell: bash
        run: |
          if [ -z "${CDM_SIGNING_STORE:-}" ]; then
            echo "::error::Configura CDM_ANDROID_KEYSTORE_BASE64 para publicar una APK instalable sin romper Google Sign-In ni perder ajustes."
            exit 1
          fi
          python tools/check_google_signin.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CDMenciana-APK-pruebas
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

