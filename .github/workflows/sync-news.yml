name: Actualizar noticias del club
on:
  push:
    branches: [main]
    paths: ['tools/sync_news.py', 'tools/club_content.py', '.github/workflows/sync-news.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: club-public-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_news.py
      - name: Guardar noticias actualizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json server/static/news.json android/app/src/main/assets/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar noticias públicas del club'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
