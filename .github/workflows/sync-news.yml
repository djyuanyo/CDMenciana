name: Actualizar noticias del club
on:
  push:
    branches: [main]
    paths: ['tools/sync_news.py', 'tools/club_content.py', '.github/workflows/sync-news.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['tools/sync_news.py', 'tools/club_content.py', '.github/workflows/sync-news.yml']
permissions:
  contents: write
concurrency:
  group: club-public-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_news.py
      - uses: actions/upload-artifact@v4
        with:
          name: Noticias-completas
          path: data/news.json
          retention-days: 7
      - name: Guardar noticias actualizadas
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json server/static/news.json android/app/src/main/assets/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar noticias públicas del club'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          node-version: '22'
      - name: Avisar de las noticias nuevas
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CDM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.CDM_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CDM_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::notice::Falta la conexión privada con Firebase para avisar de noticias.'
            exit 0
          fi
          npm install --prefix functions --ignore-scripts --no-audit --no-fund
          credential_path="$RUNNER_TEMP/club-news-firebase.json"
          trap 'rm -f "$credential_path"' EXIT
          umask 077
          printf '%s' "$CDM_FIREBASE_SERVICE_ACCOUNT" > "$credential_path"
          unset CDM_FIREBASE_SERVICE_ACCOUNT
          GOOGLE_APPLICATION_CREDENTIALS="$credential_path" node functions/github-results.js --news
