name: Compilar APK para firma local
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-review-apk.yml', 'android/app/src/main/java/es/cdmenciana/app/PushPreferences.java', 'android/app/build.gradle', 'android/app/src/main/java/**', 'android/app/src/main/assets/offline.js', 'server/static/teams.js', 'android/app/src/main/assets/fixtures.js', 'android/app/src/main/assets/fixtures-infantil.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python tools/bundle_account_assets.py
      - run: gradle -p android testDebugUnitTest assembleDebug lintDebug
      - name: Preparar archivo para revisión y firma local
        run: |
          mkdir -p review-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk review-apk/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" review-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: CDMenciana-revision-firma-local
          path: review-apk/
          retention-days: 7
