name: Actualizar partidos RFAF
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rfaf-fixtures
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sync_fixtures.py
      - name: Guardar datos públicos actualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures.json android/app/src/main/assets/fixtures.json server/static/fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar calendario público RFAF'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
