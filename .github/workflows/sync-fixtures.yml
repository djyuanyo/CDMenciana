name: Actualizar partidos RFAF
on:
  push:
    branches: [main]
    paths: ['tools/*.py', '.github/workflows/sync-fixtures.yml']
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '19 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: {group: public-results, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tools -p test_fast_updates.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/refresh_catalog.py
      - run: mkdir -p server/static android/app/src/main/assets
      - run: python tools/sync_fixtures.py --results-only
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py
  reports:
    name: Actualizar actas recientes sin esperar estadísticas
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency: {group: public-recent-reports, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/sync_recent_reports.py
        env: {CDM_REPORT_BUDGET: '180'}
      - name: Publicar actas verificadas aunque otra acta falle
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py
  profiles:
    needs: sync
    if: github.event_name != 'schedule' || github.event.schedule == '19 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: public-profiles, cancel-in-progress: true}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tools -p test_fast_updates.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/refresh_catalog.py
      - run: mkdir -p server/static android/app/src/main/assets
      - run: python tools/sync_fixtures.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py

  statistics:
    name: Actualizar estadísticas de la jornada actual
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: {group: public-current-stats, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/sync_player_stats.py
      - name: Publicar estadísticas verificadas
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py
