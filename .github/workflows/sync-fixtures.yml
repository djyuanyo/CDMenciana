name: Actualizar partidos RFAF
on:
  push:
    branches: [main]
    paths: ['tools/*.py', '.github/workflows/sync-fixtures.yml', 'server/static/fixtures.js', 'data/club-teams.json']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: club-public-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/sync_fixtures.py
      - name: Guardar datos públicos actualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_public_data.py

