name: Verificar páginas públicas para Google Play
on:
  push:
    branches: [main]
    paths: ['notification-service/legal-pages.mjs', '.github/workflows/verify-public-policies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar privacidad y eliminación sin cuenta
        run: |
          python - <<'PY'
          import urllib.request,time,json,pathlib,datetime
          root='https://cdmenciana-avisos.djyuanyo.workers.dev/'
          results=[]
          for name in ['privacy.html','delete-account.html']:
              expected=pathlib.Path('server/static/'+name).read_text()
              for attempt in range(12):
                  try:
                      request=urllib.request.Request(root+name,headers={'User-Agent':'Mozilla/5.0'})
                      r=urllib.request.urlopen(request,timeout=15);html=r.read().decode()
                      assert r.status==200 and 'text/html' in r.headers['Content-Type']
                      assert html==expected,'La política pública debe coincidir con la incluida en la app'
                      results.append({'url':root+name,'status':r.status,'public':True,'same_as_app':True})
                      print('Recurso público verificado: '+name)
                      break
                  except Exception:
                      if attempt==11:raise
                      time.sleep(10)
          pathlib.Path('play-policy-status.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: CDMenciana-politicas-publicas-verificadas, path: play-policy-status.json, retention-days: 30}
