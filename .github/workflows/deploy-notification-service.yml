name: Activar envío directo en Cloudflare
on:
  push:
    branches: [main]
    paths: ['notification-service/**', 'functions/custom-notifications.js', 'functions/team-catalog.js', '.github/workflows/deploy-notification-service.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-club-notification-service
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/test_notification_service.mjs tools/test_custom_notifications.cjs tools/test_teams_service.mjs
      - run: npm ci --prefix notification-service --ignore-scripts --no-audit --no-fund
      - name: Desplegar servicio privado de envío
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CDM_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CDM_CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.CDM_FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_IMAGE_TOKEN: ${{ secrets.CDM_GITHUB_IMAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_SERVICE_ACCOUNT GITHUB_IMAGE_TOKEN; do
            if [ -z "${!key}" ]; then echo "Falta configurar $key."; exit 1; fi
          done
          secret_file="$RUNNER_TEMP/club-worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          SECRET_FILE="$secret_file" node -e 'require("node:fs").writeFileSync(process.env.SECRET_FILE,JSON.stringify({FIREBASE_SERVICE_ACCOUNT:process.env.FIREBASE_SERVICE_ACCOUNT,GITHUB_IMAGE_TOKEN:process.env.GITHUB_IMAGE_TOKEN}))'
          cd notification-service
          SECRET_FILE="$secret_file" node bootstrap.mjs
          npx --no-install wrangler deploy --secrets-file "$secret_file" > "$RUNNER_TEMP/club-worker-deploy.log" 2>&1 || { echo 'No se pudo desplegar el servicio. Revisa la cuenta y los permisos de Cloudflare.'; exit 1; }
          DEPLOY_LOG="$RUNNER_TEMP/club-worker-deploy.log" node publish-config.mjs
      - name: Publicar dirección del servicio en la app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CD Menciana'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/notification-service.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'config: activate direct notification service'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main

