name: Avisos personalizados del club
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-custom-notifications
  cancel-in-progress: false
jobs:
  notify:
    # Secrets never run on pull requests or arbitrary branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar conexión privada
        id: connection
        env:
          CDM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.CDM_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [ -z "$CDM_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::notice::Avisos pendientes: falta configurar la conexión privada con Firebase.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.connection.outputs.enabled == 'true'
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Procesar avisos del administrador
        if: steps.connection.outputs.enabled == 'true'
        env:
          CDM_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.CDM_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          credential_path="$RUNNER_TEMP/club-firebase.json"
          trap 'rm -f "$credential_path"' EXIT
          umask 077
          if [ -z "$CDM_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo 'Falta configurar el secreto CDM_FIREBASE_SERVICE_ACCOUNT.'
            exit 1
          fi
          printf '%s' "$CDM_FIREBASE_SERVICE_ACCOUNT" > "$credential_path"
          unset CDM_FIREBASE_SERVICE_ACCOUNT
          GOOGLE_APPLICATION_CREDENTIALS="$credential_path" node functions/github-results.js --custom
