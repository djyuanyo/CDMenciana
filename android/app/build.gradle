plugins { id 'com.android.application' }
// Public previews build without inventing a Firebase project. The real config activates it.
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'es.cdmenciana.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'es.cdmenciana.app'
        minSdk 26
        targetSdk 36
        versionCode 100
        versionName '1.0.0'
    }
    if (System.getenv('CDM_SIGNING_STORE')) { signingConfigs { club { storeFile file(System.getenv('CDM_SIGNING_STORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }; buildTypes { debug { signingConfig signingConfigs.club } } }
    buildTypes { release { debuggable false; minifyEnabled false; shrinkResources false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
}

