<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#182335"><title>Taquilla · CD Menciana</title>
<style>
:root{--bg:#121b2b;--card:#1d2a40;--line:#ffffff1f;--text:#eef3fb;--muted:#9fb0c8;--accent:#2f7de1;--ok:#16824a;--bad:#b3263d;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}.brand{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.brand img{width:48px;height:48px;border-radius:50%}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}h1{margin:0 0 6px;font-size:24px}.muted{color:var(--muted)}.build{margin:18px 0 0;text-align:center;font-size:11px;opacity:.6}.small{font-size:13px;text-align:center}
form{display:grid;gap:12px;margin:16px 0 10px}label{display:grid;gap:6px;font-size:14px;color:var(--muted)}input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1726;color:var(--text);font:inherit}
button{font:inherit;cursor:pointer}.primary,.secondary{width:100%;min-height:48px;border-radius:14px;font-weight:800}.primary{border:0;background:var(--accent);color:#fff}.secondary{margin-top:4px;border:1px solid var(--line);background:transparent;color:var(--text)}.link{border:0;background:none;color:#8cc4ff;font-weight:700;padding:8px 0}.msg{color:#ff9aa8;min-height:1em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.top small{color:var(--muted)}
.event{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:14px 16px;border-radius:16px;margin-bottom:14px}.event.on{background:#1f9d5526;border:1px solid #1f9d5566}.event.off{background:#e3a51a1f;border:1px solid #e3a51a55}
.event span{grid-column:1;color:var(--muted);font-size:13px}.event strong{grid-column:1}.event b{grid-column:2;grid-row:1/3;font-size:34px;line-height:1;text-align:right}.event small{grid-column:2;text-align:right;color:var(--muted)}
.scan{padding:14px}.video{position:relative;overflow:hidden;border-radius:16px;background:#000;aspect-ratio:1}.video video{width:100%;height:100%;object-fit:cover;display:block}.frame{position:absolute;inset:18%;border:3px solid #ffffffd0;border-radius:18px;box-shadow:0 0 0 999px #0b142466}
#result{margin-top:14px;text-align:center}.verdict{padding:18px;border-radius:16px;color:#fff}.verdict.ok{background:var(--ok)}.verdict.bad{background:var(--bad)}.verdict.warn{background:var(--warn)}.verdict span{display:block;font-size:44px;line-height:1}.verdict strong{display:block;font-size:24px;margin:6px 0}.verdict p{margin:4px 0}.verdict .name{font-size:20px;font-weight:800}.verdict .warn{font-weight:800}

/* All three entry methods remain together on a small phone. */
main{padding:10px 12px 24px}.brand{gap:10px;margin:0 0 10px}.brand img{width:36px;height:36px}.brand b{font-size:16px}.brand small{font-size:12px}
.event .scan-off{grid-column:1/-1;margin-top:6px;color:#fdba74;font-weight:600}
.card.scan{padding:12px;display:grid;gap:12px;margin:0}.event{padding:10px 12px;margin-bottom:10px}.event strong{font-size:14px;overflow-wrap:anywhere}.event b{font-size:30px}.event span,.event small{font-size:12px}
.video{aspect-ratio:auto;height:clamp(120px,23vh,180px);border-radius:12px}.video.is-unavailable{height:76px}.frame{width:106px;height:106px;inset:50% auto auto 50%;transform:translate(-50%,-50%);border-width:2px;border-radius:12px}
#camera{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);border:1px solid #ffffff60;border-radius:30px;background:#101b2be6;color:#fff;font-size:12px;font-weight:700;min-height:32px;padding:6px 12px;white-space:nowrap}
#manual{margin:0;gap:4px}#manual label{font-size:12px}.number-row{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px}#number{min-width:0;height:50px;font-size:20px;font-weight:700;padding:10px 12px}.number-row .primary{height:50px;min-height:50px;border-radius:12px}
#guest{width:100%;min-height:56px;border:0;border-radius:12px;background:#137c47;color:#fff;font-size:21px;font-weight:800;touch-action:manipulation}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #80bfff;outline-offset:2px}
#result{margin:0;min-height:68px;text-align:left;overflow-wrap:anywhere}#result>p{margin:4px 0;font-size:13px}.verdict{padding:10px 12px;border-radius:12px;display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px}.verdict>span{grid-column:1;grid-row:1/7;font-size:26px;align-self:start}.verdict>strong,.verdict>p{grid-column:2;margin:1px 0}.verdict>strong{font-size:16px;line-height:1.3}.verdict>p,.verdict .name{font-size:12px;line-height:1.35}
.guest-row{display:grid;grid-template-columns:1fr;gap:8px}.guest-row #guest{grid-column:1/-1}.guest-alt{min-height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-size:16px;font-weight:800;touch-action:manipulation}
</style></head><body><main><div class="brand"><img src="crest.png" alt=""><div><b>CD Menciana</b><small>Taquilla</small></div></div><div id="app"><section class="card"><p class="muted">Cargando…</p></section></div><p class="build muted">Versión a9ec10</p></main><script src="taquilla.js?v=a9ec1017e3"></script></body></html>
